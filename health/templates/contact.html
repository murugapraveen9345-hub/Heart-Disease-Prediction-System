{% extends 'index.html' %}
{% load static %}
{% block body %}

<!-- Map -->
<div style="margin-top: 0; border-bottom: 4px solid; border-image: linear-gradient(90deg, var(--primary), var(--accent)) 1;">
    <iframe style="width:100%; height:400px; border:0; display: block;" src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d7008.270532603887!2d77.19946512476322!3d28.56570060260679!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x390ce2704247110f%3A0x2d462cca004e2ad0!2sAnsari%20Nagar%20West%2C%20New%20Delhi%2C%20Delhi!5e0!3m2!1sen!2sin!4v1639728812206!5m2!1sen!2sin" allowfullscreen></iframe>
</div>

<!-- Contact Section -->
<section style="padding: 80px 0;">
    <div class="container">
        <div class="section-header animate__animated animate__fadeIn">
            <div class="badge-label" style="display:inline-block; background: linear-gradient(135deg, rgba(14,165,233,0.1), rgba(244,63,94,0.1)); color: var(--primary); font-weight: 600; font-size: 13px; padding: 8px 18px; border-radius: 50px; letter-spacing: 1px; text-transform: uppercase; margin-bottom: 12px;">
                Contact Us
            </div>
            <h2 style="font-size: 2.5rem; font-weight: 800; letter-spacing: -0.5px;">We'd Love to <span class="gradient-text">Hear From You</span></h2>
        </div>

        <div class="row animate__animated animate__fadeInUp">
            <div class="col-lg-10 mx-auto">
                <div class="glass-card p-0 d-flex flex-column flex-md-row" style="overflow: hidden;">
                    <!-- Left - Contact Info -->
                    <div class="col-md-5 p-5 text-white" style="background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%); display: flex; flex-direction: column; justify-content: center;">
                        <h4 style="font-weight: 700; margin-bottom: 12px; font-size: 22px;">Contact Information</h4>
                        <p style="color: rgba(255,255,255,0.7); font-size: 14px; margin-bottom: 40px;">Fill out the form and our team will get back to you within 24 hours.</p>

                        <div class="d-flex align-items-center mb-4">
                            <div style="width: 40px; height: 40px; background: rgba(255,255,255,0.15); border-radius: 12px; display: flex; align-items: center; justify-content: center; margin-right: 16px; flex-shrink: 0;">
                                <i class="fa fa-map-marker" style="font-size: 16px;"></i>
                            </div>
                            <p style="color: rgba(255,255,255,0.9); margin: 0; font-size: 14px;">Coimbatore,Tamil Nadu</p>
                        </div>
                        <div class="d-flex align-items-center mb-4">
                            <div style="width: 40px; height: 40px; background: rgba(255,255,255,0.15); border-radius: 12px; display: flex; align-items: center; justify-content: center; margin-right: 16px; flex-shrink: 0;">
                                <i class="fa fa-phone" style="font-size: 16px;"></i>
                            </div>
                            <p style="color: rgba(255,255,255,0.9); margin: 0; font-size: 14px;">+91 9345758918</p>
                        </div>
                        <div class="d-flex align-items-center">
                            <div style="width: 40px; height: 40px; background: rgba(255,255,255,0.15); border-radius: 12px; display: flex; align-items: center; justify-content: center; margin-right: 16px; flex-shrink: 0;">
                                <i class="fa fa-envelope-o" style="font-size: 16px;"></i>
                            </div>
                            <a href="mailto:binarycoders@gmail.com" style="color: rgba(255,255,255,0.9); font-size: 14px;">murugapraveen9345@gmail.com</a>
                        </div>
                    </div>

                    <!-- Right - Form -->
                    <div class="col-md-7 p-5">
                        <h4 style="font-weight: 700; margin-bottom: 24px; color: var(--text-primary); font-size: 20px;">Send a Message</h4>
                        <form action="#" method="post">
                            <div class="form-row mb-3">
                                <div class="form-group col-md-6 mb-3">
                                    <label class="modern-label">Your Name</label>
                                    <input type="text" name="Name" class="form-control modern-input" placeholder="John Doe" required>
                                </div>
                                <div class="form-group col-md-6 mb-3">
                                    <label class="modern-label">Your Email</label>
                                    <input type="email" name="Email" class="form-control modern-input" placeholder="john@example.com" required>
                                </div>
                            </div>
                            <div class="form-group mb-3">
                                <label class="modern-label">Subject</label>
                                <input type="text" name="Subject" class="form-control modern-input" placeholder="How can we help?" required>
                            </div>
                            <div class="form-group mb-4">
                                <label class="modern-label">Message</label>
                                <textarea name="Message" class="form-control modern-input" rows="4" placeholder="Write your message here..." required style="resize: none;"></textarea>
                            </div>
                            <button type="submit" class="btn-primary-custom w-100 justify-content-center" style="border: none; cursor: pointer; padding: 16px;">
                                <i class="fa fa-paper-plane"></i> Send Message
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>

{% endblock %}
